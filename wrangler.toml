# wrangler.toml
# Cloudflare Pages configuration for Rezavu.
# The full deploy runbook lives in DEPLOYMENT.md — follow that, not this header.
#
# Quick reference:
#   wrangler login
#   wrangler d1 create rezavu-db                  → update database_id below
#   wrangler kv namespace create rezavu-sessions  → update id below
#   wrangler d1 execute rezavu-db --remote --file=migrations/0001_rezavu_core.sql
#   wrangler d1 execute rezavu-db --remote --file=migrations/0002_booking_rules.sql
#   npm run build
#   wrangler pages deploy ./dist --project-name=rezavu
#   wrangler pages secret put <NAME> --project-name=rezavu   (see [secrets] list below)

name = "rezavu"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# ─── D1 Database ─────────────────────────────────────────────────────────────
# Created 2026-06-12 via Cloudflare API; migrations 0001 + 0002 applied.
[[d1_databases]]
binding = "DB"
database_name = "rezavu-db"
database_id = "2d8a263f-5172-4f50-ad5b-2be16164634a"

# ─── KV Namespace (session cache) ────────────────────────────────────────────
# Created 2026-06-12 via Cloudflare API.
[[kv_namespaces]]
binding = "KV"
id = "87ba9053bea9483a82ec921123839504"

# ─── Environment variables (non-secret) ──────────────────────────────────────
[vars]
SITE_URL = "https://rezavu.octolabs.app"

# ─── Secrets (set via `wrangler pages secret put <NAME> --project-name=rezavu`)
# TWILIO_ACCOUNT_SID
# TWILIO_AUTH_TOKEN
# TWILIO_WHATSAPP_FROM
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# STRIPE_PRICE_PRO_MONTHLY
# STRIPE_PRICE_STUDIO_MONTHLY
